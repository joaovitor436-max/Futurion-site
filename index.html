<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/minilogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futurion | Software House do Futuro</title>
    <meta name="description" content="Transformamos ideias em tecnologia que define o amanhã. Desenvolvemos websites modernos, agentes de IA personalizados e aplicativos." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sora:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        function initBeams() {
          const hero = document.getElementById('hero-section');
          if (!hero) return;
          if (hero.querySelector('canvas.beams-canvas')) return;

          const canvas = document.createElement('canvas');
          canvas.className = 'beams-canvas';
          Object.assign(canvas.style, {
            position: 'absolute',
            inset: '0',
            width: '100%',
            height: '100%',
            pointerEvents: 'none',
            zIndex: '0',
            filter: 'blur(35px)',
            opacity: '0.6'
          });
          hero.insertBefore(canvas, hero.firstChild);

          const ctx = canvas.getContext('2d');
          let beams = [];
          let w, h;

          function resize() {
            const dpr = window.devicePixelRatio || 1;
            w = hero.offsetWidth;
            h = hero.offsetHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.scale(dpr, dpr);
            
            beams = [];
            const beamCount = Math.floor(w / 35);
            for (let i = 0; i < beamCount; i++) {
              beams.push(new Beam());
            }
          }

          class Beam {
            constructor() {
              this.reset();
              this.y = Math.random() * h; // Start at random height initially
            }
            reset() {
              this.x = Math.random() * w;
              this.y = h + Math.random() * 300;
              this.width = Math.random() * 2 + 1;
              this.length = Math.random() * 500 + 300;
              this.speed = Math.random() * 0.6 + 0.2;
              this.opacity = 0;
              this.maxOpacity = Math.random() * 0.5 + 0.1;
              const hues = [180, 195, 210]; // Teal, Cyan, Blue
              this.hue = hues[Math.floor(Math.random() * hues.length)];
            }
            draw() {
              this.y -= this.speed;
              if (this.opacity < this.maxOpacity) this.opacity += 0.005;
              if (this.y + this.length < -100) {
                this.reset();
              }
              const gradient = ctx.createLinearGradient(0, this.y, 0, this.y + this.length);
              gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, 0)`);
              gradient.addColorStop(0.5, `hsla(${this.hue}, 100%, 70%, ${this.opacity})`);
              gradient.addColorStop(1, `hsla(${this.hue}, 100%, 70%, 0)`);
              ctx.fillStyle = gradient;
              ctx.fillRect(this.x, this.y, this.width, this.length);
            }
          }

          function animate() {
            ctx.clearRect(0, 0, w, h);
            beams.forEach(b => b.draw());
            requestAnimationFrame(animate);
          }

          window.addEventListener('resize', resize);
          resize();
          animate();
        }

        const observer = new MutationObserver(() => {
          if (document.getElementById('hero-section')) {
            initBeams();
          }
        });

        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('load', initBeams);
      })();
    </script>
  </body>
</html>
